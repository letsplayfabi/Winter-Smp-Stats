<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Server-Leaderboard</title>
<style>
:root{--ac:#52e585;--bg:#0a111f;--pn:#131b2b;--fg:#fff;--mu:#8fa0b8;--ln:#26324a}

.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}

.sub{color:var(--mu);text-transform:uppercase;margin:4px 0 0}.bd{color:var(--ac);font-weight:700;text-transform:uppercase}
h2{font-size:17px;text-transform:uppercase;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:28px 32px;margin-top:28px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.big{grid-column:1/-1}.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px}
.hd small,.ex{color:var(--mu);font-size:12px}.hd small{text-transform:uppercase}
.box{background:var(--pn);padding:10px 12px;border-radius:4px}
.row{display:grid;grid-template-columns:var(--nm,140px) 1fr;align-items:center;gap:10px;margin:6px 0}
.nm{display:flex;justify-content:flex-end;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;overflow:hidden}.nm img{border-radius:3px;image-rendering:pixelated}
.tr{display:flex;align-items:center;gap:8px}.bar{height:22px;border-radius:2px;min-width:2px}.val{font-size:13px;white-space:nowrap}
.ex{margin-top:6px}footer{margin-top:32px}footer b{color:var(--ac);text-transform:uppercase;font-size:13px}
dialog{background:var(--pn);color:var(--fg);border:1px solid var(--ln);border-radius:16px;max-width:560px;width:92%;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;padding:0;animation:pop .2s ease}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}@keyframes pop{from{transform:scale(.94);opacity:0}}
.ph{display:flex;gap:18px;align-items:flex-end;padding:22px 22px 8px}.ph img{filter:drop-shadow(0 6px 8px rgba(0,0,0,.5));image-rendering:pixelated}
.pt h2{font-size:28px;margin:0 0 6px;text-transform:none}.pt p{margin:6px 0 0;color:var(--mu)}
.chip{display:inline-block;color:#000;font-weight:700;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--ac)}
.pb{padding:12px 22px 22px}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tile{background:var(--bg);border-radius:10px;padding:10px}.tile small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase}.tile b{font-size:18px}
.death{margin:12px 0;padding:10px 12px;border-radius:10px;background:var(--bg);border-left:4px solid var(--ac)}
.pb h3{margin:14px 0 6px;font-size:13px;text-transform:uppercase;color:var(--mu)}.pb button{margin-top:16px;padding:8px 18px;border:0;border-radius:8px;background:var(--ac);color:#000;font-weight:700;cursor:pointer}
.mr{display:grid;grid-template-columns:120px 1fr 60px;align-items:center;gap:8px;font-size:13px;margin:3px 0}.mr em{font-style:normal;text-align:right;color:var(--mu)}
.mt{background:var(--bg);border-radius:4px;height:8px}.mt div{height:8px;border-radius:4px}
.evc{display:flex;background:var(--pn);border-radius:12px;overflow:hidden;margin:14px 0;border:1px solid var(--ln)}.evc img{width:260px;object-fit:cover}
.evb{padding:14px 18px;flex:1}.evb h3{margin:0 0 4px;font-size:20px}.evd{color:var(--ac);font-weight:600}.evb p{white-space:pre-wrap;margin:8px 0 0}.past{opacity:.5}
@media(max-width:600px){.evc{flex-direction:column}.evc img{width:100%;max-height:200px}}
.dc{background:#5865F2;color:#fff;font-weight:700;text-decoration:none;padding:8px 16px;border-radius:99px;white-space:nowrap}
#pill{position:fixed;right:16px;bottom:16px;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:8px;background:var(--ac);color:#000;padding:10px 14px;border-radius:99px;font-weight:700;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:pop .3s ease;z-index:5}
#pill[hidden]{display:none}#pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#pill b{cursor:pointer;opacity:.6;padding:0 4px}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#cmpb,#setb{background:var(--pn);color:var(--fg);border:1px solid var(--ln);cursor:pointer;font:inherit;font-weight:700}
#cc,#sc{padding:20px}.ct{width:100%;border-collapse:collapse;margin:10px 0}.ct td,.ct th{padding:6px 8px;border-bottom:1px solid var(--ln)}.ct td:nth-child(n+2),.ct th:nth-child(n+2){text-align:right}.ct .w{color:var(--ac);font-weight:700}
#cc select,#sc select{padding:8px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);font:inherit;flex:1}#cc button,#sc button{margin-top:8px;padding:8px 18px;border:0;border-radius:8px;background:var(--ac);color:#000;font-weight:700;cursor:pointer}
.cb{display:inline-block;margin:10px 8px 0 0;padding:6px 12px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.row.me{outline:1px solid var(--ac);border-radius:6px;background:color-mix(in srgb,var(--ac) 14%,transparent)}.row.me .nm{font-weight:700;color:var(--ac)}
.compact .bar{height:14px}.compact .row{margin:3px 0}#sc label.k{display:block;margin:6px 0;cursor:pointer}#sc h3{margin:14px 0 4px;font-size:13px;text-transform:uppercase;color:var(--mu)}
#ctl{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}#ctl button{padding:6px 12px;border-radius:99px;border:1px solid var(--ln);background:var(--pn);color:var(--fg);font:inherit;font-size:13px;cursor:pointer}#ctl button.on{background:var(--ac);color:#000;border-color:transparent;font-weight:700}
.nl{display:inline-flex;align-items:center;gap:6px;cursor:pointer}.nl img{border-radius:3px;image-rendering:pixelated}
.cols{display:flex;gap:10px;align-items:flex-end;overflow-x:auto;padding:4px 0}.col{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}.col small{font-size:12px}
.col .ct2{height:150px;width:100%;display:flex;align-items:flex-end}.col .cb2{width:100%;border-radius:3px 3px 0 0;min-height:2px}.col .nl{flex-direction:column;font-size:12px;max-width:84px;word-break:break-word}
.pw{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.pie{width:180px;height:180px;flex:0 0 auto}.lg{flex:1 1 200px}.lr{display:flex;align-items:center;gap:8px;margin:5px 0}.lr i{width:12px;height:12px;border-radius:3px;flex:0 0 auto}.mu2{margin-left:auto;color:var(--mu);font-size:13px;white-space:nowrap}
.lt{width:100%;border-collapse:collapse}.lt td{padding:7px 8px;border-bottom:1px solid var(--ln)}.lt td:first-child{width:34px;color:var(--mu)}.lt td:last-child{text-align:right}.lt tr.me2{outline:1px solid var(--ac)}
.box{container-type:inline-size}.nm{min-width:0}.nm .t,.nl .t{overflow:hidden;text-overflow:ellipsis}
.cols{justify-content:space-around}.col{flex:1 1 64px;max-width:110px}
@container (max-width:460px){
.cols{gap:6px}.col{flex:1 1 30px}.col small{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;white-space:nowrap}
.col .nl{max-width:none}.col .nl img{width:18px;height:18px}.col .nl .t{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;max-height:90px}
.col .ct2{height:110px}.col small{height:80px}.col .nl{min-height:92px}.pie{width:140px;height:140px}}
</style></head><body><main>
<nav class="nav" id="nav"></nav>
<section id="lb"><header><div><h1 id="t">Server Leaderboard</h1><p class="sub" id="s"></p><p class="ex" id="stt"></p><p class="ex" id="mine"></p></div><div class="hr"><button class="dc" id="setb">⚙️ Einstellungen</button><button class="dc" id="cmpb" hidden>⚖️ Vergleichen</button><a class="dc" id="dcl" target="_blank" rel="noopener" hidden></a></div></header>
<p class="ex" id="i"></p><div id="ctl"></div><div class="grid" id="g"></div><footer id="f"></footer></section>
<section id="ev" hidden></section>

<dialog id="d"><div id="dc"></div></dialog>
<dialog id="cmp"><div id="cc"></div></dialog>
<dialog id="set"><div id="sc"></div></dialog>
</main>
<script>
const CATS=[
["playtime","Spielzeit",1,p=>p.minutes,v=>Math.floor(v/60)+" h "+String(v%60).padStart(2,"0")+" min"],
["player_kills","Spieler-Kills",1,p=>p.player_kills],
["deaths","Tode",0,p=>p.deaths],
["travel","Gereist (km)",1,p=>p.km_travelled],
["mined","Blöcke abgebaut",1,p=>p.blocks_mined,0,p=>p.top_blocks],
["used","Items verwendet",1,p=>p.items_used,0,p=>p.top_used],
["killed","Entities getötet",1,p=>p.entities_killed],

["diamonds","💎 Diamanten",1,p=>p.diamonds]];
const MOB={zombie:"Zombie",skeleton:"Skelett",creeper:"Creeper",spider:"Spinne",enderman:"Enderman",cow:"Kuh",pig:"Schwein",sheep:"Schaf",chicken:"Huhn",witch:"Hexe",slime:"Schleim",drowned:"Ertrunkener",player:"Spieler"};
const EXTRA={
netherite:["netherite","Netherite gefarmt",1,p=>(p.x||{}).debris||0],
creepers:["creepers","Creeper getötet",1,p=>(p.x||{}).creepers||0],
netherrack:["netherrack","Netherrack abgebaut",1,p=>(p.x||{}).netherrack||0],
deepslate:["deepslate","Deepslate abgebaut",1,p=>(p.x||{}).deepslate||0],
elytra:["elytra","Elytra-Strecke (km)",1,p=>(p.x||{}).aviate_km||0]};
const TRAV={walk:"Gehen",sprint:"Sprinten",crouch:"Schleichen",swim:"Schwimmen",fly:"Fliegen",aviate:"Elytra",boat:"Boot",horse:"Pferd",minecart:"Lore",pig:"Schwein",strider:"Schreiter",climb:"Klettern",walk_on_water:"Über Wasser",walk_under_water:"Unter Wasser",happy_ghast:"Glücklicher Ghast",nautilus:"Nautilus"};
const COL=["#52e585","#45b0f5","#e9bc57","#bb92f2","#f39a68","#f2677a"];
const $=id=>document.getElementById(id),n=v=>Number(v).toLocaleString("de-AT",{maximumFractionDigits:1});
const pretty=(id,m)=>(m&&m[id])||(/\s/.test(id)?id:id.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase()));
let SERVERS=[],OV={},CTX={},COLS=COL;
function el(tag,text,parent,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;parent&&parent.append(e);return e}
const head=(p,z)=>{const i=document.createElement("img");i.src=`https://mc-heads.net/avatar/${p.uuid}/${z*2}`;i.width=i.height=z;i.alt="";i.onerror=()=>{i.onerror=()=>i.remove();i.src=`https://crafatar.com/avatars/${p.uuid}?size=${z*2}&overlay`};return i};
function rank(c,players){
  const hi=c[2],get=c[3],s=[...players].sort((a,b)=>hi?get(b)-get(a):get(a)-get(b)),N=s.length,pts=new Map();
  for(let i=0,j;i<N;i=j){j=i;while(j<N&&get(s[j])===get(s[i]))j++;let sum=0;for(let x=i;x<j;x++)sum+=N-x;for(let x=i;x<j;x++)pts.set(s[x].uuid,sum/(j-i))}
  return{s,pts};
}
function chart(parent,title,note,sorted,get,fmt,color,extra,big){
  const card=el("section","",parent,big?"big":""),hd=el("div","",card,"hd");el("h2",title,hd);el("small",note,hd);
  const box=el("div","",card,"box"),max=Math.max(...sorted.map(get),1);
  if((PREF.chart||"bars")!=="bars"&&RENDER[PREF.chart]){RENDER[PREF.chart](box,sorted,get,fmt,color,big);if(extra)el("div",extra,card,"ex");return}
  sorted.forEach(p=>{const r=el("div","",box,"row"),nm=el("span","",r,"nm");if(p.uuid===PREF.me)r.classList.add("me");nm.title=p.display_name;nm.append(...(PREF.heads!==false?[head(p,20)]:[]),tspan((p.uuid===PREF.me?"⭐ ":"")+p.display_name+(big&&BADGE.names&&p.badges&&p.badges.length?" "+p.badges.slice(0,4).map(a=>a.icon||"🏆").join(""):"")));if(big&&BADGE.names&&p.badges&&p.badges.length)nm.title=p.badges.map(a=>a.title).join(", ");nm.onclick=()=>profile(p);
    const t=el("div","",r,"tr"),b=el("div","",t,"bar");b.style.cssText=`width:${get(p)/max*80}%;background:${color(p)}`;el("span",fmt(get(p)),t,"val")});
  if(extra)el("div",extra,card,"ex");
}
function mini(b,title,items,m,c){if(!items.length)return;el("h3",title,b);const mx=items[0][1]||1;
  items.slice(0,5).forEach(([k,v])=>{const r=el("div","",b,"mr");el("span",pretty(k,m),r);const t=el("div","",r,"mt"),x=el("div","",t);x.style.cssText=`width:${v/mx*100}%;background:${c}`;el("em",n(v),r)})}
function profile(p){
  const b=$("dc"),c=CTX.col(p);b.replaceChildren();
  const ph=el("div","",b,"ph");ph.style.background=`linear-gradient(135deg,${c}55,transparent 70%)`;
  const bi=document.createElement("img");bi.src=`https://mc-heads.net/body/${p.uuid}/140`;bi.height=140;bi.alt="";
  bi.onerror=()=>{bi.onerror=()=>bi.remove();bi.src=`https://crafatar.com/renders/body/${p.uuid}?scale=4&overlay`};ph.append(bi);
  const ti=el("div","",ph,"pt");el("h2",p.display_name,ti);if(p.title)el("span",p.title,ti,"chip").style.background=c;
  el("p","Platz "+(CTX.order.indexOf(p)+1)+" · "+n(CTX.tot.get(p.uuid))+" Punkte",ti);
  const pb=el("div","",b,"pb"),tl=el("div","",pb,"tiles");
  [["Spielzeit",Math.floor(p.minutes/60)+" h "+p.minutes%60+" min"],["7 Tage",p.week_hours+" h"],["Tode",n(p.deaths)],["Schaden",n(p.damage)+" HP"],["Spieler-Kills",n(p.player_kills)],
   ["Entities getötet",n(p.entities_killed)],["Blöcke",n(p.blocks_mined)],["💎 Diamanten",n(p.diamonds)],["Gereist",p.km_travelled+" km"],["Sprünge",n(p.jumps)]]
   .forEach(([l,v])=>{const t=el("div","",tl,"tile");el("small",l,t);el("b",v,t)});
  const cs=p.death_causes.map(([k,v])=>[pretty(k,MOB),v]);if(p.death_other>0)cs.push(["Umwelt/Sonstiges (Sturz, Lava, Ertrinken …)",p.death_other]);
  cs.sort((a,z)=>z[1]-a[1]);
  el("div",p.deaths?"💀 Häufigste Todesursache: "+(cs[0]?cs[0][0]+" ("+cs[0][1]+"×)":"unbekannt"):"🎉 Noch nie gestorben",pb,"death");
  if(BADGE.profile&&p.badges&&p.badges.length){el("h3","🏆 Erfolge",pb);p.badges.forEach(a=>el("div",`${a.icon||"🏆"} ${a.title}`+(a.desc?" – "+a.desc:""),pb,"death"))}
  mini(pb,"Todesursachen",cs,null,c);mini(pb,"Meistgetötete Mobs",p.top_mobs,MOB,c);mini(pb,"Meistabgebaute Blöcke",p.top_blocks,null,c);
  mini(pb,"Gereist nach Art (km)",Object.entries(p.travel).sort((a,z)=>z[1]-a[1]),TRAV,c);
  el("button","Schließen",pb).onclick=()=>$("d").close();
  document.body.style.overflow="hidden";$("d").scrollTop=0;$("d").showModal();
}
$("d").onclick=e=>{if(e.target===$("d"))$("d").close()};
$("d").addEventListener("close",()=>document.body.style.overflow="");

let CUR="",BADGE={names:true,profile:true};
const STT={online:"online",offline:"offline",starting:"startet",stopping:"stoppt",restarting:"startet neu",saving:"speichert",loading:"lädt",crashed:"abgestürzt",pending:"wartet",preparing:"bereitet vor"};
const hm=iso=>new Date(iso).toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"});
async function status(d,k){const st=d.status||{},box=$("stt");box.textContent="";box.title="";
  if(st.state){box.textContent=`${st.state==="online"?"🟢":st.state==="offline"?"🔴":"🟡"} ${st.state==="online"?st.count+"/"+st.max+" online":STT[st.state]||st.state} · Stand ${hm(st.checked||d.updated)}`;box.title=(st.list||[]).join(", ")}
  if(!st.address)return;
  try{const c=new AbortController();setTimeout(()=>c.abort(),6000);
    const r=await fetch("https://api.mcsrvstat.us/3/"+encodeURIComponent(st.address),{signal:c.signal}).then(r=>r.json());
    if(CUR===k&&typeof r.online==="boolean"){const p=r.players||{};box.textContent=r.online?`🟢 ${p.online??0}/${p.max??"?"} online · Live`:"🔴 offline · Live";box.title=(p.list||[]).map(x=>x.name).join(", ")}}catch{}}
const GET=()=>({...Object.fromEntries([...CATS,...Object.values(EXTRA)].map(c=>[c[0],c[3]])),jumps:p=>p.jumps});
function badges(data,key){const L=(OV.achievements||[]).filter(a=>!a.server||a.server==="all"||a.server===key),G=GET();data.forEach(p=>p.badges=[]);
  L.forEach(a=>{const g=G[a.metric];if(!g||!data.length)return;
    if(a.type==="top"){const vs=data.map(g),best=a.dir==="min"?Math.min(...vs):Math.max(...vs);if(a.dir!=="min"&&best<=0)return;data.forEach(p=>{if(g(p)===best)p.badges.push(a)})}
    else data.forEach(p=>{if(g(p)>=(a.value||0))p.badges.push(a)})})}
function compare(){
  const b=$("cc"),D=CTX.data;b.replaceChildren();el("h2","Spielervergleich",b).style.margin="0 0 10px";
  const row=el("div","",b);row.style.cssText="display:flex;gap:8px";const sel=[0,1].map(i=>{const s=document.createElement("select");D.forEach(p=>el("option",p.display_name,s).value=p.uuid);s.value=D[i%D.length].uuid;row.append(s);return s});
  const out=el("div","",b);
  const draw=()=>{out.replaceChildren();const [A,B]=sel.map(s=>D.find(p=>p.uuid===s.value)),t=el("table","",out,"ct"),h=el("tr","",t);el("th","",h);[A,B].forEach(p=>{const th=el("th","",h);th.append(head(p,24),document.createTextNode(" "+p.display_name))});
    let wa=0,wb=0;CTX.cats.forEach(c=>{const g=c[3],f=c[4]||n,x=g(A),y=g(B),r=el("tr","",t);el("td",CTX.lab[c[0]]||c[1],r);
      const better=x===y?0:(c[2]?x>y:x<y)?1:2;if(better===1)wa++;if(better===2)wb++;el("td",f(x),r,better===1?"w":"");el("td",f(y),r,better===2?"w":"")});
    el("p",`Kategorien gewonnen: ${A.display_name} ${wa} : ${wb} ${B.display_name}`,out,"ex")};
  sel.forEach(s=>s.onchange=draw);draw();el("button","Schließen",b).onclick=()=>$("cmp").close();document.body.style.overflow="hidden";$("cmp").showModal();
}
$("cmpb").onclick=compare;$("cmp").onclick=e=>{if(e.target===$("cmp"))$("cmp").close()};$("cmp").addEventListener("close",()=>document.body.style.overflow="");
const fz=ms=>new Date(ms-new Date(ms).getTimezoneOffset()*6e4).toISOString().replace(/[-:]/g,"").slice(0,15);
function ics(e){const esc=x=>(x||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;"),s=T(e),L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Server Leaderboard//DE","BEGIN:VEVENT","UID:"+e.id+"@leaderboard","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z"];
  if(e.time)L.push("DTSTART:"+fz(s),"DTEND:"+fz(s+36e5));else L.push("DTSTART;VALUE=DATE:"+e.date.replace(/-/g,""),"DTEND;VALUE=DATE:"+fz(s+864e5).slice(0,8));
  L.push("SUMMARY:"+esc(e.name),"DESCRIPTION:"+esc(e.desc),"END:VEVENT","END:VCALENDAR");return L.join("\r\n")}
function calBtns(e,box){const b=el("button","📅 In Kalender speichern (.ics)",box,"cb");
  b.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics(e)],{type:"text/calendar"}));a.download=(e.name||"event").replace(/[^\w-]+/g,"_")+".ics";a.click()};
  const g=el("a","Google Kalender",box,"cb");g.target="_blank";g.rel="noopener";
  g.href=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(e.name)}&dates=${e.time?fz(T(e))+"/"+fz(T(e)+36e5):e.date.replace(/-/g,"")+"/"+fz(T(e)+864e5).slice(0,8)}&details=${encodeURIComponent(e.desc||"")}`}
const PREF={me:"",cols:0,heads:true,compact:false,hide:[],chart:"bars",bar:true,width:"wide"};
try{Object.assign(PREF,JSON.parse(localStorage.getItem("lbp")||"{}"))}catch{}
