<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Server-Statistiken</title>
<style>
:root{--bg:#fff;--fg:#1c1c1c;--mu:#6b6b6b;--ln:#e2e2e2;--ac:#2f7d32}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mu:#9a9a9a;--ln:#333;--ac:#6fcf73}}
body{font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:1000px;margin:0 auto;padding:24px 16px}
h1{margin:0 0 4px}p{color:var(--mu);margin:0 0 20px}.w{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th:first-child,td:first-child{text-align:left}td:first-child{cursor:pointer;color:var(--ac)}
th{cursor:pointer;color:var(--mu);font-weight:600;user-select:none}th.on{color:var(--ac)}
small{color:var(--mu);display:block}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--ln);border-radius:10px;max-width:520px;width:90%}
dialog h3{margin:12px 0 4px}dialog ul{margin:0;padding-left:18px}
</style></head><body>
<h1 id="t">Statistiken</h1><p id="i"></p>
<div class="w"><table><thead><tr id="h"></tr></thead><tbody id="b"></tbody></table></div>
<dialog id="d"><div id="dc"></div><p><button onclick="d.close()">Schließen</button></p></dialog>
<script>
const COLS=[["display_name","Spieler"],["hours","Spielzeit (h)"],["week_hours","7 Tage (h)"],["deaths","Tode"],["mob_kills","Mob-Kills"],["blocks_mined","Blöcke"],["diamonds","💎 Diamanten"],["km_travelled","Gereist (km)"],["jumps","Sprünge"]];
const MOB={zombie:"Zombie",skeleton:"Skelett",creeper:"Creeper",spider:"Spinne",enderman:"Enderman",cow:"Kuh",pig:"Schwein",sheep:"Schaf",chicken:"Huhn",witch:"Hexe",slime:"Schleim",drowned:"Ertrunkener"};
const pretty=(id,m)=>(m&&m[id])||id.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const $=id=>document.getElementById(id),n=v=>Number(v).toLocaleString("de-AT");
let data=[],key="hours",asc=false;
function el(tag,text,parent){const e=document.createElement(tag);e.textContent=text;parent&&parent.append(e);return e}
function render(){
  const rows=[...data].sort((a,b)=>(typeof a[key]==="string"?a[key].localeCompare(b[key]):a[key]-b[key])*(asc?1:-1));
  $("h").replaceChildren(...COLS.map(([k,l])=>{const th=el("th",l);if(k===key)th.className="on";th.onclick=()=>{asc=k===key?!asc:k==="display_name";key=k;render()};return th}));
  $("b").replaceChildren(...rows.map(p=>{const tr=document.createElement("tr");
    COLS.forEach(([k],i)=>{const td=el("td",i?n(p[k]):p[k]);if(!i){td.onclick=()=>profile(p);if(p.title)el("small",p.title,td)}tr.append(td)});return tr}));
  if(!rows.length)$("i").textContent="Noch keine Statistiken gefunden.";
}
function list(box,title,items,m){if(!items.length)return;el("h3",title,box);const u=el("ul","",box);items.forEach(([k,v])=>el("li",pretty(k,m)+": "+n(v),u))}
function profile(p){
  const b=$("dc");b.replaceChildren();el("h2",p.display_name,b);if(p.title)el("p",p.title,b);
  const u=el("ul","",b);[["Spielzeit",p.hours+" h"],["Letzte 7 Tage",p.week_hours+" h"],["Tode",n(p.deaths)],["Mob-Kills",n(p.mob_kills)],["Blöcke abgebaut",n(p.blocks_mined)],["Diamanten",n(p.diamonds)],["Gereist",p.km_travelled+" km"]].forEach(([a,v])=>el("li",a+": "+v,u));
  list(b,"Meistgetötete Mobs",p.top_mobs,MOB);list(b,"Meistabgebaute Blöcke",p.top_blocks);
  list(b,"Gereist nach Art (km)",Object.entries(p.travel).sort((a,c)=>c[1]-a[1]));$("d").showModal();
}
Promise.all([fetch("stats.json",{cache:"no-cache"}).then(r=>r.json()),
  fetch("overrides.json",{cache:"no-cache"}).then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([d,ov])=>{
  const o=ov.players||{},s=ov.site||{};
  data=d.players.map(p=>{const x=o[p.uuid]||o[p.name]||{};return{...p,display_name:x.display_name||p.name,title:x.title||"",hidden:!!x.hidden}}).filter(p=>!p.hidden);
  $("t").textContent=s.title||"Statistiken";
  $("i").textContent=[s.intro,"Stand: "+new Date(d.updated).toLocaleString("de-AT")].filter(Boolean).join(" · ");render();
}).catch(()=>{$("i").textContent="stats.json konnte nicht geladen werden."});
</script></body></html>
