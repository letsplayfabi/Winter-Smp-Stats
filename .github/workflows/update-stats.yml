name: Statistiken aktualisieren
on:
  schedule: [{ cron: "*/30 * * * *" }]   # alle 30 Minuten (Mindestabstand bei GitHub: 5 Minuten)
  workflow_dispatch: {}                # auch manuell startbar
concurrency: { group: stats, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python fetch_stats.py
        env:
          EXAROTON_TOKEN: ${{ secrets.EXAROTON_TOKEN }}
          EXAROTON_SERVER_ID: ${{ secrets.EXAROTON_SERVER_ID }}
          EXAROTON_SERVER_ID_2: ${{ secrets.EXAROTON_SERVER_ID_2 }}
      - run: |
          git config user.name "stats-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A docs/data docs/servers.json
          git diff --cached --quiet || (git commit -m "Statistiken aktualisiert" && git pull --rebase && git push)
