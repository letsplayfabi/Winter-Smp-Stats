name: Statistiken aktualisieren
on:
  schedule: [{ cron: "*/30 * * * *" }]   # alle 30 Minuten (Mindestabstand bei GitHub: 5 Minuten)
  workflow_dispatch:                   # auch manuell startbar; die Mod schickt Rekorde/Stimmen als "moddata" mit
    inputs:
      moddata:
        description: "Daten von der Mod (Rekorde, Umfragen) – leer lassen"
        required: false
        type: string
concurrency: { group: stats, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # immer den neuesten Stand holen, nie den Stand vom Start-Zeitpunkt
      - run: python fetch_stats.py
        env:
          MOD_DATA: ${{ inputs.moddata }}
          EXAROTON_TOKEN: ${{ secrets.EXAROTON_TOKEN }}
          EXAROTON_SERVER_ID: ${{ secrets.EXAROTON_SERVER_ID }}
          EXAROTON_SERVER_ID_2: ${{ secrets.EXAROTON_SERVER_ID_2 }}
      - run: python -m pip install --quiet pillow || python -m pip install --quiet --break-system-packages pillow
        continue-on-error: true   # nur für das Rückblick-Bild nötig
      - run: python notify.py
        continue-on-error: true   # Discord-Probleme dürfen die Statistik nicht blockieren
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - run: |
          git config user.name "stats-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A docs/data docs/servers.json docs/skins
          git diff --cached --quiet || (git commit -m "Statistiken aktualisiert" && git pull --rebase && git push)
